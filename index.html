<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlos Pérez-Cavero</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            line-height: 1.6;
            color: #333;
            background: #ffffff;
            padding: 0 20px 60px 20px;
        }

        /* Navigation bar */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            padding: 18px 0;
            margin-bottom: 20px;
        }

        .navbar-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .navbar-name {
            color: #000;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: normal;
        }

        .navbar-name:hover {
            text-decoration: none;
        }

        .navbar-links {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .navbar a {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            color: #333;
            text-decoration: none;
            font-size: 0.95em;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
        }

        .navbar a:hover {
            color: #1565c0;
            border-bottom: 2px solid #1565c0;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .navbar-inner {
                gap: 18px;
            }

            .navbar a {
                font-size: 0.85em;
            }
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
        }

        /* Profile photo styling */
        .profile-section {
            display: flex;
            align-items: flex-start;
            gap: 30px;
            margin-bottom: 40px;
        }

        .profile-left {
            flex-shrink: 0;
        }

        .profile-photo {
            width: 250px;
            height: 312px;
            object-fit: cover;
            display: block;
            margin-bottom: 0;
        }

        .contact-box {
            color: #333;
            padding: 15px;
            width: 250px;
            font-size: 0.9em;
            line-height: 1.3;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }

        .contact-box a {
            color: #1565c0;
            text-decoration: none;
        }

        .contact-box a:hover {
            text-decoration: underline;
        }

        .profile-content {
            flex: 1;
        }

        h1 {
            font-size: 2.2em;
            margin-bottom: 20px;
            font-weight: normal;
            color: #000;
        }

        .intro {
            margin-bottom: 50px;
            font-size: 1.05em;
            text-align: justify;
            hyphens: auto;
        }

        .job-market-highlight {
            color: #a65a00;
            font-weight: 600;
        }

        h2 {
            font-size: 1.5em;
            margin: 50px 0 25px 0;
            font-weight: 600;
            color: #000;
        }

        #about, #research, #teaching {
            scroll-margin-top: 90px;
        }

        h3 {
            font-size: 1.15em;
            margin: 30px 0 10px 0;
            font-weight: 600;
            color: #000;
        }

        .paper-title {
            display: inline;
            font-size: 1.05em;
            font-style: italic;
            line-height: 1.6;
        }

        .coauthors {
            display: inline;
            font-size: 0.95em;
            color: #666;
            margin-left: 8px;
        }

        .paper-title-line {
            margin-bottom: 8px;
        }

        .paper-links {
            margin-bottom: 25px;
            font-size: 0.95em;
        }

        .paper-links a {
            color: #1565c0;
            text-decoration: none;
            margin-right: 15px;
        }

        .paper-links a:hover {
            text-decoration: underline;
        }

        .abstract-toggle {
            color: #1565c0;
            cursor: pointer;
            user-select: none;
            margin-right: 15px;
        }

        .abstract-toggle:hover {
            text-decoration: underline;
        }

        .abstract-content {
            display: none;
            margin: 20px 0;
            padding: 20px;
            background: #f9f9f9;
            border-left: 3px solid #ddd;
            font-size: 0.95em;
            line-height: 1.7;
        }

        .abstract-content.show {
            display: block;
        }

        .key-findings {
            margin: 15px 0;
        }

        .key-findings h4 {
            font-size: 1em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .key-findings ul {
            list-style: none;
            padding-left: 0;
        }

        .key-findings li {
            padding: 4px 0;
            padding-left: 18px;
            position: relative;
            font-size: 0.95em;
        }

        .key-findings li:before {
            content: "–";
            position: absolute;
            left: 0;
        }

        /* Figure carousel styling */
        .figures-grid {
            position: relative;
            margin: 20px 0;
            max-width: 100%;
        }

        .figure-slide {
            display: none;
            width: 100%;
        }

        .figure-slide.active {
            display: block;
        }

        .figure-container {
            width: 100%;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 20px;
        }

        .figure-slide img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .figure-caption {
            text-align: center;
            font-size: 0.9em;
            color: #666;
            margin-top: 10px;
            font-style: italic;
        }

        .carousel-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .carousel-btn {
            background: #a65a00;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        .carousel-btn:hover {
            background: #8a4a00;
        }

        .carousel-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .carousel-counter {
            font-size: 0.9em;
            color: #666;
        }

        .paper-item {
            margin-bottom: 35px;
        }

        a {
            color: #1565c0;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .teaching-list, .experience-list, .WIP-list {
            list-style: none;
            padding-left: 0;
        }

        .teaching-list li, .experience-list li, .WIP-list li {
            padding: 6px 0;
            padding-left: 18px;
            position: relative;
        }

        .teaching-list li:before, .experience-list li:before, .WIP-list li:before {
            content: "–";
            position: absolute;
            left: 0;
        }

        /* New teaching block layout */
        .teaching-block p {
            margin: 6px 0;
        }

        .teaching-block .teaching-entry {
            margin-left: 24px;
        }

        .teaching-block .teaching-award {
            margin-top: 10px;
            margin-left: 18px;
        }

        .teaching-block .teaching-institution {
            margin-top: 20px;
        }

        .teaching-block .teaching-institution:first-child {
            margin-top: 0;
        }

        /* Mobile responsive adjustments */
        @media (max-width: 768px) {
            body {
                padding: 40px 15px;
            }

            h1 {
                font-size: 1.6em;
            }

            .profile-section {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .profile-left {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .profile-photo {
                width: 220px;
                height: 275px;
            }

            .contact-box {
                width: 180px;
            }

            .figure-container {
                height: 280px;
            }
        }
    </style>
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="index.html" class="navbar-name">Carlos Pérez-Cavero</a>
            <div class="navbar-links">
                <a href="#about">About</a>
                <a href="#research">Research</a>
                <a href="#teaching">Teaching</a>
                <a href="personal.html">Personal</a>
            </div>
        </div>
    </nav>

    <!-- El contenido se carga aquí dinámicamente desde profile.html, papers.html y others.html -->
    <div class="container">
        <div id="profile"></div>
        <div id="papers"></div>
        <div id="teaching"></div>
    </div>

    <!-- JavaScript para cargar el contenido y para abstracts / carousels -->
    <script>
        function toggleAbstract(id) {
            const abstract = document.getElementById(id);
            const toggle = abstract.previousElementSibling.querySelector('.abstract-toggle');
            const label = toggle.dataset.label || 'abstract';

            if (abstract.classList.contains('show')) {
                abstract.classList.remove('show');
                toggle.textContent = '▸ ' + label;
            } else {
                abstract.classList.add('show');
                toggle.textContent = '▾ ' + label;
            }
        }

        // Figure carousel functionality
        function initCarousels() {
            const carousels = document.querySelectorAll('.figures-grid');

            carousels.forEach((carousel) => {
                const slides = carousel.querySelectorAll('.figure-slide');
                if (slides.length === 0) return;

                let currentSlide = 0;

                // Show first slide
                slides[currentSlide].classList.add('active');

                // Create navigation
                const nav = document.createElement('div');
                nav.className = 'carousel-nav';

                const prevBtn = document.createElement('button');
                prevBtn.className = 'carousel-btn';
                prevBtn.textContent = '← Previous';
                prevBtn.onclick = () => changeSlide(-1);

                const counter = document.createElement('span');
                counter.className = 'carousel-counter';
                counter.textContent = `${currentSlide + 1} / ${slides.length}`;

                const nextBtn = document.createElement('button');
                nextBtn.className = 'carousel-btn';
                nextBtn.textContent = 'Next →';
                nextBtn.onclick = () => changeSlide(1);

                nav.appendChild(prevBtn);
                nav.appendChild(counter);
                nav.appendChild(nextBtn);
                carousel.appendChild(nav);

                function changeSlide(direction) {
                    slides[currentSlide].classList.remove('active');
                    currentSlide = (currentSlide + direction + slides.length) % slides.length;
                    slides[currentSlide].classList.add('active');
                    counter.textContent = `${currentSlide + 1} / ${slides.length}`;

                    // Update button states
                    prevBtn.disabled = currentSlide === 0;
                    nextBtn.disabled = currentSlide === slides.length - 1;
                }

                // Initialize button states
                prevBtn.disabled = true;
            });
        }

        // Cargar cada sección en su contenedor correspondiente
        function cargarSeccion(archivo, contenedorId) {
            return fetch(archivo)
                .then(response => response.text())
                .then(html => {
                    document.getElementById(contenedorId).innerHTML = html;
                })
                .catch(error => {
                    console.error(`Error cargando ${archivo}:`, error);
                });
        }

        Promise.all([
            cargarSeccion('profile.html', 'profile'),
            cargarSeccion('papers.html', 'papers'),
            cargarSeccion('teaching.html', 'teaching')
        ]).then(() => {
            initCarousels(); // se ejecuta solo cuando TODO ya cargó
        });
    </script>
</body>
</html>
