<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlos Pérez-Cavero</title>
    <link rel="icon" type="image/png" sizes="32x32" href="figures/lse-favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="figures/lse-favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="figures/lse-apple-touch-icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            line-height: 1.6;
            color: #444;
            background: #ffffff;
        }

        a {
            color: #267CB9;
            text-decoration: none;
        }

        a:hover {
            color: #06c;
            text-decoration: underline;
        }

        /* Top navigation panel */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
        }

        .navbar-inner {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            padding: 18px 40px;
        }

        .navbar-name {
            color: #000;
            text-decoration: none;
            font-size: 1.15em;
        }

        .navbar-name:hover {
            text-decoration: none;
        }

        .navbar-links {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .navbar-links a {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            color: #444;
            font-size: 0.9em;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
        }

        .navbar-links a:hover {
            color: #267CB9;
            border-bottom: 2px solid #267CB9;
            text-decoration: none;
        }

        .navbar-links a.active {
            color: #267CB9;
            border-bottom: 2px solid #267CB9;
        }

        /* Two-column layout */
        .wrapper {
            max-width: 1300px;
            margin: 0 auto;
            padding: 45px 40px 70px 40px;
            display: flex;
            align-items: flex-start;
            gap: 80px;
        }

        header {
            width: 300px;
            flex-shrink: 0;
            position: sticky;
            top: 90px;
        }

        .profile-photo {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 18px;
            border-radius: 3px;
        }

        .sidebar-subtitle {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 20px;
        }

        .sidebar-subtitle p {
            margin: 0 0 2px 0;
        }

        .contact-list {
            list-style: none;
        }

        .contact-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            font-size: 0.88em;
        }

        .contact-icon {
            display: inline-flex;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            color: #999;
        }

        .contact-icon svg {
            width: 100%;
            height: 100%;
        }

        section {
            flex: 1;
            min-width: 0;
            max-width: 830px;
        }

        #about, #research, #teaching {
            scroll-margin-top: 90px;
        }

        h1 {
            font-size: 2.1em;
            margin-bottom: 20px;
            font-weight: normal;
            color: #000;
        }

        .intro {
            margin-bottom: 10px;
            font-size: 1.05em;
            text-align: justify;
            hyphens: auto;
        }

        .intro p {
            margin-bottom: 15px;
        }

        .job-market-highlight {
            color: #a65a00;
            font-weight: 600;
        }

        h2 {
            font-size: 1.5em;
            margin: 45px 0 22px 0;
            font-weight: 600;
            color: #393939;
        }

        section > h2:first-child {
            margin-top: 0;
        }

        h3 {
            font-size: 1.15em;
            margin: 30px 0 10px 0;
            font-weight: 600;
            color: #494949;
        }

        hr {
            border: 0;
            background: #e5e5e5;
            height: 1px;
            margin: 40px 0;
        }

        .paper-title {
            display: inline;
            font-size: 1.05em;
            font-style: italic;
            line-height: 1.6;
        }

        .coauthors {
            display: inline;
            font-size: 0.95em;
            color: #777;
            margin-left: 8px;
        }

        .paper-title-line {
            margin-bottom: 8px;
        }

        .paper-links {
            margin-bottom: 25px;
            font-size: 0.95em;
        }

        .paper-links a {
            margin-right: 15px;
        }

        .toggle-link {
            color: #267CB9;
            cursor: pointer;
            user-select: none;
            margin-right: 15px;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }

        .toggle-content {
            display: none;
            margin: 20px 0;
            padding: 20px;
            background: #f8f8f8;
            border-left: 3px solid #ddd;
            font-size: 0.95em;
            line-height: 1.7;
        }

        .toggle-content.show {
            display: block;
        }

        .key-findings {
            margin: 15px 0;
        }

        .key-findings h4 {
            font-size: 1em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .key-findings ul {
            list-style: none;
            padding-left: 0;
        }

        .key-findings li {
            padding: 4px 0;
            padding-left: 18px;
            position: relative;
            font-size: 0.95em;
        }

        .key-findings li:before {
            content: "–";
            position: absolute;
            left: 0;
        }

        /* Figure carousel styling */
        .figures-grid {
            position: relative;
            margin: 20px 0;
            max-width: 100%;
        }

        .figure-slide {
            display: none;
            width: 100%;
        }

        .figure-slide.active {
            display: block;
        }

        .figure-container {
            width: 100%;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f8f8;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
            padding: 20px;
        }

        .figure-slide img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .figure-caption {
            text-align: center;
            font-size: 0.9em;
            color: #777;
            margin-top: 10px;
            font-style: italic;
        }

        .carousel-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .carousel-btn {
            background: #267CB9;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        .carousel-btn:hover {
            background: #1c5f8f;
        }

        .carousel-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .carousel-counter {
            font-size: 0.9em;
            color: #777;
        }

        .paper-item {
            margin-bottom: 35px;
        }

        .teaching-list, .experience-list, .WIP-list {
            list-style: none;
            padding-left: 0;
        }

        .teaching-list li, .experience-list li, .WIP-list li {
            padding: 6px 0;
            padding-left: 18px;
            position: relative;
        }

        .teaching-list li:before, .experience-list li:before, .WIP-list li:before {
            content: "–";
            position: absolute;
            left: 0;
        }

        .teaching-block p {
            margin: 6px 0;
        }

        .teaching-block .teaching-entry {
            margin-left: 24px;
        }

        .teaching-block .teaching-award {
            margin-top: 10px;
            margin-left: 18px;
        }

        .teaching-block .teaching-institution {
            margin-top: 20px;
        }

        .teaching-block .teaching-institution:first-child {
            margin-top: 0;
        }

        /* Responsive: stack sidebar above content */
        @media (max-width: 900px) {
            .navbar-inner {
                padding: 16px 20px;
            }

            .wrapper {
                flex-direction: column;
                gap: 30px;
                padding: 30px 20px 50px 20px;
            }

            header {
                width: 100%;
                position: static;
                display: flex;
                align-items: center;
                gap: 24px;
            }

            .profile-photo {
                width: 160px;
                margin-bottom: 0;
                flex-shrink: 0;
            }

            .contact-list {
                display: flex;
                flex-wrap: wrap;
                gap: 6px 20px;
            }

            .contact-list li {
                margin-bottom: 0;
            }

            section {
                max-width: 100%;
            }
        }

        @media (max-width: 560px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .profile-photo {
                width: 140px;
            }

            .figure-container {
                height: 280px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="index.html" class="navbar-name">Carlos Pérez-Cavero</a>
            <div class="navbar-links">
                <a href="#about">About</a>
                <a href="#research">Research</a>
                <a href="#teaching">Teaching</a>
                <!-- <a href="personal.html">Personal</a> -->
            </div>
        </div>
    </nav>

    <div class="wrapper">
        <!-- El panel izquierdo se carga dinámicamente desde sidebar.html -->
        <header id="sidebar"></header>

        <!-- El contenido se carga aquí dinámicamente desde profile.html, papers.html y teaching.html -->
        <section>
            <div id="profile"></div>
            <hr>
            <div id="papers"></div>
            <hr>
            <div id="teaching"></div>
        </section>
    </div>

    <!-- JavaScript para cargar el contenido y para abstracts / carousels -->
    <script>
        function toggleContent(toggleEl, id) {
            const content = document.getElementById(id);
            const label = toggleEl.dataset.label || 'abstract';

            if (content.classList.contains('show')) {
                content.classList.remove('show');
                toggleEl.textContent = '▸ ' + label;
            } else {
                content.classList.add('show');
                toggleEl.textContent = '▾ ' + label;
            }
        }

        // Figure carousel functionality
        function initCarousels() {
            const carousels = document.querySelectorAll('.figures-grid');

            carousels.forEach((carousel) => {
                const slides = carousel.querySelectorAll('.figure-slide');
                if (slides.length === 0) return;

                let currentSlide = 0;

                // Show first slide
                slides[currentSlide].classList.add('active');

                // Create navigation
                const nav = document.createElement('div');
                nav.className = 'carousel-nav';

                const prevBtn = document.createElement('button');
                prevBtn.className = 'carousel-btn';
                prevBtn.textContent = '← Previous';
                prevBtn.onclick = () => changeSlide(-1);

                const counter = document.createElement('span');
                counter.className = 'carousel-counter';
                counter.textContent = `${currentSlide + 1} / ${slides.length}`;

                const nextBtn = document.createElement('button');
                nextBtn.className = 'carousel-btn';
                nextBtn.textContent = 'Next →';
                nextBtn.onclick = () => changeSlide(1);

                nav.appendChild(prevBtn);
                nav.appendChild(counter);
                nav.appendChild(nextBtn);
                carousel.appendChild(nav);

                function changeSlide(direction) {
                    slides[currentSlide].classList.remove('active');
                    currentSlide = (currentSlide + direction + slides.length) % slides.length;
                    slides[currentSlide].classList.add('active');
                    counter.textContent = `${currentSlide + 1} / ${slides.length}`;

                    // Update button states
                    prevBtn.disabled = currentSlide === 0;
                    nextBtn.disabled = currentSlide === slides.length - 1;
                }

                // Initialize button states
                prevBtn.disabled = true;
            });
        }

        // Cargar cada sección en su contenedor correspondiente
        function cargarSeccion(archivo, contenedorId) {
            return fetch(archivo, { cache: 'no-store' })
                .then(response => response.text())
                .then(html => {
                    document.getElementById(contenedorId).innerHTML = html;
                })
                .catch(error => {
                    console.error(`Error cargando ${archivo}:`, error);
                });
        }

        Promise.all([
            cargarSeccion('sidebar.html', 'sidebar'),
            cargarSeccion('profile.html', 'profile'),
            cargarSeccion('papers.html', 'papers'),
            cargarSeccion('teaching.html', 'teaching')
        ]).then(() => {
            initCarousels(); // se ejecuta solo cuando TODO ya cargó
        });
    </script>
</body>
</html>
